mesh:
  type: structured
  element type: quad
  x blocks: 1
  y blocks: 1
  x elements: 100
  y elements: 100

solution fields:
  u:
    basis order: 3
    field type: scalar
    function space: Hgrad
    integration order: 2

functions:
  f:
    type: analytic
    variables: [x, y, t]
    function: 8 * pi * sin(2 * pi * x) * sin(2 * pi * y)
  zero:
    type: analytic
    variables: [x, y, t]
    function: 0

initial conditions:
  - field: u
    function: zero
    blocks: [eblock-0_0]

boundary conditions:
  - field: u
    function: zero
    side sets: [bottom, left, right, top]
    type: dirichlet

physics:
  type: poisson
  solution fields: [u]
  source function: f
